<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoordFinder Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 100%;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
        }
        h1 {
            color: #111827;
            margin-top: 0;
            font-size: 1.5em;
            padding: 12px 16px;
            background: #374151;
            color: white;
            margin: -20px -20px 20px -20px;
        }
        .code-block {
            background: #f9fafb;
            border-left: 3px solid #6b7280;
            padding: 12px;
            margin: 12px 0;
            font-family: monospace;
            font-size: 0.875em;
            overflow-x: auto;
        }
        .output {
            background: #f0fdf4;
            border-left: 3px solid #22c55e;
            padding: 12px;
            margin: 12px 0;
            font-family: monospace;
            font-size: 0.875em;
        }
        .section {
            margin: 16px 0;
            padding: 16px;
            background: #f9fafb;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
        }
        .section h2 {
            color: #111827;
            margin-top: 0;
            font-size: 1.125em;
        }
        button {
            background: #4b5563;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.875em;
            margin: 4px;
        }
        button:active {
            background: #374151;
        }
        .point-card {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
        }
        .point-card h3 {
            margin-top: 0;
            color: #111827;
            font-size: 1em;
        }
        .rating {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        .rating-high { background: #4caf50; color: white; }
        .rating-medium { background: #ff9800; color: white; }
        .rating-low { background: #f44336; color: white; }
        .log-output {
            background: #263238;
            color: #aed581;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ CoordFinder Interactive Demo</h1>
        <p style="color: #666; margin-bottom: 20px;">Version: <span id="cfVersion">...</span></p>
        
        <div class="section">
            <h2>Input Text</h2>
            <textarea id="inputText" class="code-block" oninput="updateAllOutputs()" style="width: 100%; min-height: 80px; font-family: 'Courier New', monospace; padding: 15px; border: 1px solid #ddd; border-radius: 5px; resize: vertical;">The ship was at 58.8 and 10,9. Lighthouse at 58°54,0'N, 011 00,0 E.</textarea>
        </div>

        <div class="section">
            <h2>1. Simple Usage - CF.pointsIn()</h2>
            <p>rating: 
                <select id="ratingSelect" onchange="runSimpleDemo()" style="padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
                    <option value="default">Default (0.5)</option>
                    <option value="1.0">1.0</option>
                    <option value="0.9">0.9</option>
                    <option value="0.8">0.8</option>
                    <option value="0.7">0.7</option>
                    <option value="0.6">0.6</option>
                    <option value="0.5">0.5</option>
                    <option value="0.4">0.4</option>
                    <option value="0.3">0.3</option>
                    <option value="0.2">0.2</option>
                    <option value="0.1">0.1</option>
                    <option value="0.0">0.0</option>
                </select>
            </p>
            <div id="simple-output"></div>
        </div>

        <div class="section">
            <h2>2. Different Output Formats - p.asText()</h2>
            <p>Running: <code>p.asText(options)</code></p>
            <p>
                format: 
                <select id="formatSelect" onchange="updateFormatOutput()" style="padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
                    <option value="plain">plain (default)</option>
                    <option value="degrees">degrees</option>
                    <option value="degreesandminutes">degreesandminutes</option>
                    <option value="degreesminutesandseconds">degreesminutesandseconds</option>
                </select>
                <br><br>
                directionLetter: 
                <select id="directionSelect" onchange="updateFormatOutput()" style="padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
                    <option value="null">null (default)</option>
                    <option value="before">before</option>
                    <option value="after">after</option>
                    <option value="none">none</option>
                </select>
                <br><br>
                compact: 
                <select id="compactSelect" onchange="updateFormatOutput()" style="padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
                    <option value="false">false (default)</option>
                    <option value="true">true</option>
                </select>
                <br><br>
                localized: 
                <select id="localizedSelect" onchange="updateFormatOutput()" style="padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
                    <option value="true">true (default)</option>
                    <option value="false">false</option>
                </select>
                <br><br>
                symbols: 
                <select id="symbolsSelect" onchange="updateFormatOutput()" style="padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
                    <option value="false">false (default)</option>
                    <option value="true">true</option>
                </select>
            </p>
            <div id="format-output"></div>
        </div>
    </div>

    <script>
        // Cache-busting: use timestamp to force reload of JS files
        var cacheBust = new Date().getTime();
        document.write('<script src="../src/coordfinder.js?v=' + cacheBust + '"><\/script>');
    </script>
    <script>
        var versionText = 'v' + (CF.version || 'unknown');
        if (CF.build && CF.build !== 'dev') {
            versionText += ' (build ' + CF.build + ')';
        }
        document.getElementById('cfVersion').textContent = versionText;
        
        function getText() {
            return document.getElementById('inputText').value;
        }

        function getRatingClass(rating) {
            if (rating >= 0.8) return 'rating-high';
            if (rating >= 0.5) return 'rating-medium';
            return 'rating-low';
        }

        function updateAllOutputs() {
            runSimpleDemo();
            updateFormatOutput();
        }

        function runSimpleDemo() {
            var text = getText();
            var output = document.getElementById('simple-output');
            var ratingSelect = document.getElementById('ratingSelect');
            var minRating = ratingSelect.value;
            
            var codeText, displayRating;
            if (minRating === 'default') {
                codeText = 'var cf = new CF();<br>cf.parse(text);<br>var points = cf.points(); // default rating: 0.5';
                displayRating = '0.5 (default)';
            } else {
                codeText = 'var cf = new CF();<br>cf.parse(text);<br>var points = cf.points({rating: ' + minRating + '});';
                displayRating = minRating;
            }
            output.innerHTML = '<p>Running:</p><div class="code-block">' + codeText + '</div>';
            
            try {
                var cf = new CF();
                cf.parse(text);
                var points;
                if (minRating === 'default') {
                    points = cf.points();
                } else {
                    points = cf.points({rating: parseFloat(minRating)});
                }
                
                var html = '<div class="output">';
                html += '<strong>Found ' + points.length + ' coordinate pairs (rating ≥ ' + displayRating + '):</strong><br><br>';
                
                for (var i = 0; i < points.length; i++) {
                    var p = points[i];
                    html += '<div class="point-card">';
                    html += '<h3>Point ' + (i + 1) + '</h3>';
                    html += '<strong>Formatted:</strong> ' + p.asText() + '<br>';
                    html += '<strong>Latitude:</strong> ' + p.latitude().toFixed(6) + '<br>';
                    html += '<strong>Longitude:</strong> ' + p.longitude().toFixed(6) + '<br>';
                    html += '<strong>Rating:</strong> <span class="rating ' + getRatingClass(p.rating()) + '">' + 
                            p.rating().toFixed(2) + '</span><br>';
                    html += '<strong>Original:</strong> ' + p.originalText() + '<br>';
                    html += '<strong>Context:</strong> ' + p.context({maxChars: 30});
                    html += '</div>';
                }
                
                html += '</div>';
                output.innerHTML += html;
            } catch(e) {
                output.innerHTML += '<div class="output" style="background:#ffebee;border-color:#f44336;">Error: ' + 
                                   e.message + '</div>';
            }
        }

        function updateFormatOutput() {
            try {
                var text = getText();
                var output = document.getElementById('format-output');
                
                // Get all option values
                var format = document.getElementById('formatSelect').value;
                var direction = document.getElementById('directionSelect').value;
                var compact = document.getElementById('compactSelect').value === 'true';
                var localized = document.getElementById('localizedSelect').value === 'true';
                var symbols = document.getElementById('symbolsSelect').value === 'true';
                
                // Build options object
                var opts = {
                    format: format,
                    compact: compact,
                    localized: localized,
                    symbols: symbols
                };
                if (direction !== 'null') {
                    opts.directionLetter = direction;
                }
                
                var points = CF.pointsIn(text);
                if (points.length === 0) {
                    output.innerHTML = '<div class="output">No points found</div>';
                    return;
                }
                
                var html = '<div class="output">';
                html += '<strong>Options: </strong><code>' + JSON.stringify(opts) + '</code><br><br>';
                
                for (var i = 0; i < points.length; i++) {
                    var p = points[i];
                    html += '<div class="point-card">';
                    html += '<h3>Point ' + (i + 1) + '</h3>';
                    html += '<strong>Input:</strong> ' + p.originalText() + '<br>';
                    html += '<strong>Output:</strong> ' + p.asText(opts);
                    html += '</div>';
                }
                
                html += '</div>';
                output.innerHTML = html;
            } catch(e) {
                var output = document.getElementById('format-output');
                if (output) {
                    output.innerHTML = '<div class="output" style="background:#ffebee;border-color:#f44336;">Error: ' + 
                                       e.message + '<br>Stack: ' + e.stack + '</div>';
                }
                console.error('updateFormatOutput error:', e);
            }
        }

        // Auto-run demos on load
        window.onload = function() {
            runSimpleDemo();
            updateFormatOutput();
        };
    </script>
</body>
</html>
